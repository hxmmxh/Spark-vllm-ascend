[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-vllm-ascend"
version = "0.1.0"
description = "High-speed Spark inference on Ascend 950 with vLLM"
readme = "README.en.md"
requires-python = ">=3.12,<3.13"
license-files = ["licenses/*.txt"]

[project.entry-points."vllm.general_plugins"]
spark2_5 = "spark_vllm_ascend.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["spark_vllm_ascend*"]
namespaces = true

[tool.setuptools.package-data]
"spark_vllm_ascend.plugin" = ["*.jinja"]
"spark_vllm_ascend.native.head" = ["*.cpp", "*.h", "*.asc"]
"spark_vllm_ascend.native.head_reference" = ["*.cpp", "*.h", "*.asc"]
